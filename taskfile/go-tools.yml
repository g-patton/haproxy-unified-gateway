#https://taskfile.dev/
version: '3'

tasks:

  ensure-check-go-tool:
    desc: 'ensure check-go-tool is installed'
    silent: true
    internal: true
    status:
      - command -v check-go-tool
    cmds:
      - go install github.com/oktalz/check-go-tool@latest

  check-go-tool:
    desc: 'ensure go tool is installed/available'
    silent: true
    internal: true
    deps:
      - task: ensure-check-go-tool
    cmds:
      - check-go-tool '{{ index . .TOOL }}' >/dev/null

  check-go-tools:
    desc: 'ensure all go tools are installed'
    silent: true
    internal: true
    cmds:
      - for:
          var: TOOLS
        task: check-go-tool
        vars:
          TOOL: '{{.ITEM}}'

  # check-go-tool cannot install staticcheck here: the tools/go.mod module
  # pins x/tools at v0.50.0, which reads Go 1.27 export data; the upstream
  # release pins v0.44.1, which does not.
  install-staticcheck:
    desc: 'install staticcheck via tools/go.mod and print its path'
    silent: true
    dir: tools
    cmds:
      - |
        go install honnef.co/go/tools/cmd/staticcheck
        BIN="$(go env GOBIN)"
        if [ -z "$BIN" ]; then BIN="$(go env GOPATH)/bin"; fi
        echo "$BIN/staticcheck"

  tools-install:
    cmds:
      - task: check-go-tools
        vars:
          TOOLS: [YQ, KIND, CLOUD_PROVIDER_KIND, CONTROLLER_GEN, CHECK_COMMIT, BETTERALIGN, GO_LICENSES, GOVULNCHECK, GOFUMPT, REVIVE, GOTESTSUM]
      - task: install-staticcheck
      - task: check-kubectl
